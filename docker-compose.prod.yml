# Production stack for the remote MCP server.
#
#   mcp       backend/src/mcp/http-server.ts (the MCP server Claude connects to)
#   postgres  holds the failure-pattern table
#   caddy     OPTIONAL HTTPS front door; only started with `--profile caddy`
#
# There is deliberately NO frontend service: the Next.js app only talks to the
# old /api/reviews local-repo flow and nothing here uses it.
#
# HTTPS is NOT handled by the default stack. Two ways to get it:
#
#   A) The company's own proxy / load balancer terminates TLS (default).
#      It forwards https://<DOMAIN>/... to this host's port MCP_PORT (8080).
#        docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
#      The mcp port is published on 127.0.0.1 only, which is right when the proxy
#      runs on this same machine. If the proxy is on a different machine, set
#      MCP_BIND=0.0.0.0 in deploy/.env AND firewall the port so only that proxy
#      can reach it (the app has no TLS of its own).
#
#   B) No company proxy: let Caddy get a Let's Encrypt certificate itself. Needs
#      a DNS name for this host and ports 80 + 443 open to the internet.
#        docker compose -f docker-compose.prod.yml --env-file deploy/.env --profile caddy up -d --build
#
# Setup: cp deploy/.env.example deploy/.env, then fill in the values.
#
# On start, `mcp` applies database migrations and seeds the pattern rows itself,
# so a brand-new empty Postgres needs no manual setup. Nothing irreplaceable
# lives in the database (the patterns come from the repo), so the volume is for
# convenience, not backup-critical.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pr_reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: pr_reviewer
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` on purpose: only the mcp container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_reviewer -d pr_reviewer"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GITLAB_URL: ${GITLAB_URL:?set GITLAB_URL in deploy/.env}
      DATABASE_URL: postgresql://pr_reviewer:${POSTGRES_PASSWORD}@postgres:5432/pr_reviewer
      # Number of reverse-proxy hops in front of the app (the company proxy, or
      # caddy). The rate limiter uses it to find the real client IP; too low and
      # all users share one bucket. Add a hop per extra proxy/CDN in the chain.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # The public hostname clients use. Requests whose Host header differs are
      # rejected, so the proxy must pass the original Host through unchanged.
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in deploy/.env}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
    # No GITLAB_TOKEN and no LLM_* here, deliberately: every caller sends their
    # own GitLab token in an Authorization header, and the agent-reasoned flow
    # needs no LLM key.
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
